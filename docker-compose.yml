services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: netstarter-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - netstarter_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: netstarter-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NetStarterDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Command Timeout=30"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "5028:8080"

volumes:
  netstarter_sql_data: